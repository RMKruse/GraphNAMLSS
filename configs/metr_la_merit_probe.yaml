stage: first_real_data_evidence_gate
dataset: metr_la
primary_comparison:
  reference_model: deterministic_namlss
  candidate_model: tracer_bullet_graph_namlss
secondary_context:
  - model: distributional_gnn_baseline
    role: distributional_secondary_context
  - model: point_gnn_reference
    role: point_accuracy_guardrail
training_standard:
  concept_demonstrator_fit: deterministic_tracer_bullet_fit
  merit_probe_fit: optimizer_trained_graph_namlss
  next_implementation_path: optimizer_trained_graph_namlss_training
further_investment_gate:
  primary_distributional_signals:
    - nll
    - crps
  guardrail_metrics:
    - coverage
    - pit
    - mae
    - rmse
  # Declared before any real METR-LA comparison is seen; see the decision record.
  # Every threshold is a positive magnitude on the mean per-seed paired difference
  # (candidate minus reference): an improvement is a difference at or below
  # -threshold, a degradation a difference above +tolerance.
  declared_rules:
    decision_record: docs/adr/0006-declare-further-investment-gate-rules-before-the-merit-probe.md
    evaluation_partition: test
    paired_difference: candidate_minus_reference
    gate_seeds: [1, 2, 3, 4, 5]
    qualification_run:
      seed: 0
      evaluated_partitions: [train, validation]
    minimum_completed_seeds: 4
    maximum_dissenting_seeds: 1
    primary_signals:
      nll:
        difference: absolute
        clear_improvement: 0.02
        meaningful_improvement: 0.01
      crps:
        difference: relative
        clear_improvement: 0.02
        meaningful_improvement: 0.01
    guardrails:
      coverage:
        statistic: absolute_coverage_error
        interval_level: 0.9
        difference: absolute
        serious_degradation: 0.02
      pit:
        statistic: ks_distance_from_uniform
        difference: absolute
        serious_degradation: 0.02
      mae:
        statistic: mae
        difference: relative
        serious_degradation: 0.02
      rmse:
        statistic: rmse
        difference: relative
        serious_degradation: 0.02
    failed_seeds:
      infrastructure_failure: rerun_identical_seed_and_recipe
      training_failure: record_without_rerun
      replacement: never
    outcome_precedence:
      - inconclusive_when_too_few_completed_seeds
      - fail_when_no_meaningful_primary_improvement
      - pass_when_gate_met
      - inconclusive_otherwise
failure_rule:
  next_step: diagnose
  diagnostic_areas:
    - data
    - baseline
    - fitting_method
    - graph_stream
    - scale_predictor
    - horizon_choice
  blocked_expansions:
    - pems_bay_replication
    - primary_experiment_matrix
    - bayesian_graph_streams
    - medical_applications
replication_gate:
  dataset: pems_bay
  after: promising_metr_la_merit_probe
  purpose: test_generalization
