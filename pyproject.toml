[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphnamlss"
version = "0.1.0"
description = "Self-contained experiments for interpretable distributional graph regression."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "GraphNAMLSS contributors" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "PyYAML>=6.0"
]

[project.scripts]
graphnamlss = "graphnamlss.cli:main"

[project.optional-dependencies]
dev = [
  "numpy>=1.26",
  "pytest>=8.0",
  "torch>=2.5"
]
torch = [
  "torch>=2.5"
]
pyg = [
  "torch>=2.5",
  "torch-geometric>=2.6"
]
traffic = [
  "numpy>=1.26",
  "pandas>=2.2"
]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "nbformat>=5.10",
  "pandas>=2.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
